name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Required status check name. Branch protection must require "CI".
    name: CI
    runs-on: ubuntu-latest
    # Leaves room for one 5-minute browser install and one retry, then the smoke test.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser
        id: playwright-install
        timeout-minutes: 5
        continue-on-error: true
        run: npx playwright install --with-deps chromium

      - name: Retry Playwright browser install
        if: steps.playwright-install.outcome == 'failure' || steps.playwright-install.outcome == 'cancelled'
        timeout-minutes: 5
        run: |
          # The timed-out attempt leaves root apt-get holding the lists lock.
          sudo pkill -x apt-get || true
          sudo pkill -x apt || true
          sleep 2
          sudo dpkg --configure -a || true
          npx playwright install --with-deps chromium

      - name: End-to-end smoke test
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
